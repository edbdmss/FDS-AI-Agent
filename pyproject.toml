[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fds-ai-agent"
version = "0.1.0"
description = "PaySim 기반 금융 이상거래 탐지 및 자동 조사 AI Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
data = ["pyspark==4.0.1", "pandas>=2.2,<3", "pyarrow>=18,<24"]
notebook = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "matplotlib>=3.9,<4"]
ml = ["lightgbm>=4.5,<5", "scikit-learn>=1.5,<2", "joblib>=1.4,<2"]
agent = ["langgraph>=1,<2", "httpx>=0.27,<1"]
db = ["sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
